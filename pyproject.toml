[project]
name = "carbonx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2",
    "pydantic>=2.9", "pandas>=2.2", "numpy>=2.0",
    "pdfplumber>=0.11", "openpyxl>=3.1", "xlrd>=2.0", "requests>=2.32",
]

[project.optional-dependencies]
ml  = ["torch>=2.4", "transformers>=4.45", "scikit-learn>=1.5",
       "xgboost>=2.1", "shap>=0.46", "python-doctr>=0.9"]
dev = ["pytest>=8.3", "hypothesis>=6.112", "mypy>=1.11", "ruff>=0.7"]

[tool.mypy]
strict = true
files = ["src/carbonx/units", "src/carbonx/factors"]

[tool.ruff]
line-length = 88
