<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CarbonX Console</title>
<style>
/* Design tokens. Six hexes; every other tone is a mix of Ink into Canvas or Surface. */
:root {
  color-scheme: dark;
  --canvas: #0B0D0F; --surface: #12161A; --ink: #E6E8EB;
  --accent: #4DA3FF; --ok: #3DD68C; --bad: #FF6B5E;
  --muted: color-mix(in srgb, var(--ink) 62%, var(--canvas));   /* text, 6.1:1 on Surface */
  --faint: color-mix(in srgb, var(--ink) 45%, var(--canvas));   /* hairlines and marks only */
  --rule: color-mix(in srgb, var(--ink) 11%, var(--canvas));
  --rule-2: color-mix(in srgb, var(--ink) 20%, var(--canvas));
  --raise: color-mix(in srgb, var(--ink) 5%, var(--surface));
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --ok-soft: color-mix(in srgb, var(--ok) 13%, var(--surface));
  --bad-soft: color-mix(in srgb, var(--bad) 14%, var(--surface));
  --r: 4px; --bar: 48px; --rail: 208px;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/20px var(--sans);
       -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.mono, code, kbd, .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code { font-size: 12.5px; background: var(--raise); padding: 1px 5px; border-radius: var(--r); overflow-wrap: anywhere; }
kbd { font-size: 11px; line-height: 16px; border: 1px solid var(--rule-2); border-radius: var(--r); padding: 0 5px; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 12px; line-height: 16px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .acc { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -48px; background: var(--accent); color: var(--canvas); padding: 8px 12px;
        border-radius: var(--r); z-index: 100; font-weight: 600; }
.skip:focus { top: 8px; }
[hidden] { display: none !important; }

/* Shell */
.bar { position: sticky; top: 0; z-index: 30; height: var(--bar); display: flex; align-items: center; gap: 16px;
       padding: 0 16px; background: var(--canvas); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
.mark { width: 16px; height: 16px; border: 1.5px solid var(--accent); border-radius: 3px; position: relative; }
.mark::after { content: ""; position: absolute; inset: 3px 3px 3px 7px; background: var(--accent); border-radius: 1px; }
.org { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.find { display: flex; align-items: center; gap: 24px; height: 28px; padding: 0 8px 0 12px; background: var(--surface);
        border: 1px solid var(--rule-2); border-radius: var(--r); color: var(--muted); cursor: pointer; min-width: 220px; justify-content: space-between; }
.find:hover { border-color: var(--faint); color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--rule-2);
        border-radius: var(--r); background: var(--surface); cursor: pointer; font-size: 12px; white-space: nowrap; }
.chip:hover { border-color: var(--faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.bad { background: var(--bad); }
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100dvh - var(--bar)); }
.rail { position: sticky; top: var(--bar); align-self: start; height: calc(100dvh - var(--bar)); padding: 12px 8px;
        border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.rail a { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 8px 0 12px; border-radius: var(--r);
          color: var(--muted); text-decoration: none; transition: background-color .12s, color .12s; }
.rail a:hover { background: var(--raise); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.rail .count { font: 12px var(--mono); color: var(--muted); }
.rail .note { margin-top: auto; padding: 12px; color: var(--muted); font-size: 12px; line-height: 16px; border-top: 1px solid var(--rule); }
main { min-width: 0; padding: 24px 32px 64px; max-width: 1320px; width: 100%; }
main:focus { outline: none; }
.view { animation: rise .18s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { margin: 0; font: 600 22px/28px var(--sans); letter-spacing: -0.02em; }
h2 { margin: 0; font: 600 13px/20px var(--sans); }
h3 { margin: 0 0 8px; font: 600 13px/20px var(--sans); }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 72ch; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--rule-2); border-radius: var(--r);
       font-size: 12px; color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--canvas)); background: var(--ok-soft); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--canvas)); background: var(--bad-soft); }
.tag.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--canvas)); background: var(--accent-soft); }

/* Panels and tables */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: inset 0 1px 0 rgb(255 255 255 / .03); min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 8px 16px; border-bottom: 1px solid var(--rule); }
.pad { padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.stack > * + * { margin-top: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--rule);
        border-radius: var(--r); box-shadow: inset 0 1px 0 rgb(255 255 255 / .03); }
.kpi { padding: 16px 20px; min-width: 0; } .kpi + .kpi { border-left: 1px solid var(--rule); }
.kpi .k { color: var(--muted); font-size: 12px; }
.kpi .v { font: 500 30px/40px var(--mono); letter-spacing: -0.03em; margin-top: 2px; white-space: nowrap; }
.kpi .v small { font-size: 15px; color: var(--muted); letter-spacing: 0; }
.kpi .d { font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 2px; }
.scroll { overflow: auto; max-width: 100%; }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: left; font-weight: 500; font-size: 12px; color: var(--muted);
     height: 32px; padding: 0 12px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
td { height: 32px; padding: 4px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; white-space: nowrap; }
td.wrap { white-space: normal; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
tbody tr { transition: background-color .1s; }
tbody tr[data-calc], tbody tr[data-open] { cursor: pointer; }
tbody tr:hover { background: var(--raise); }
tbody tr[aria-current="true"] { background: var(--accent-soft); }
tfoot td { border-top: 1px solid var(--rule-2); border-bottom: 0; color: var(--muted); }
.sortbtn { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; height: 32px; }
.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sortbtn::after { content: ""; border: 3.5px solid transparent; border-top-color: var(--faint); margin-top: 3px; opacity: 0; }
th[aria-sort] .sortbtn::after { opacity: 1; }
th[aria-sort="ascending"] .sortbtn::after { transform: rotate(180deg); margin-top: -3px; }
.rowlink { all: unset; cursor: pointer; font-family: var(--mono); }
.rowlink:hover { color: var(--accent); }
.rowlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: var(--r);
       border: 1px solid var(--rule-2); background: var(--surface); cursor: pointer; white-space: nowrap;
       transition: background-color .12s, border-color .12s, transform .06s; }
.btn:hover { background: var(--raise); border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--canvas); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); background: var(--raise); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { all: unset; box-sizing: border-box; cursor: pointer; height: 26px; padding: 0 10px; font-size: 13px; color: var(--muted);
              display: inline-flex; align-items: center; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button:hover { color: var(--ink); background: var(--raise); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--canvas); border: 1px solid var(--rule-2); border-radius: var(--r);
                          height: 28px; padding: 0 8px; min-width: 0; }
textarea { height: auto; padding: 6px 8px; resize: vertical; width: 100%; }
input:hover, select:hover, textarea:hover { border-color: var(--faint); }
input::placeholder, textarea::placeholder { color: var(--muted); }
label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.tools .grow { flex: 1; min-width: 160px; }
.field { min-width: 0; }
.field input, .field select { width: 100%; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.msg { font-size: 13px; margin-top: 8px; }
.notice { border: 1px solid var(--rule-2); border-left: 2px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: var(--r); font-size: 13px; }
.notice.warn { border-left-color: var(--bad); background: var(--bad-soft); }
.notice.good { border-left-color: var(--ok); background: var(--ok-soft); }

/* Key-value, hashes */
dl.kv { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.hash { display: flex; align-items: center; gap: 8px; font: 12px/16px var(--mono); overflow-wrap: anywhere; }
.copy { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); padding: 2px 6px; border: 1px solid var(--rule-2); border-radius: var(--r); white-space: nowrap; }
.copy:hover { color: var(--ink); border-color: var(--faint); } .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
pre { margin: 0; padding: 12px; background: var(--canvas); border: 1px solid var(--rule); border-radius: var(--r); overflow: auto; font: 12px/18px var(--mono); }
.diff-a { color: var(--bad); } .diff-b { color: var(--ok); }

/* Drawer */
.drawer { position: fixed; z-index: 40; top: var(--bar); right: 0; bottom: 0; width: min(480px, 100vw); background: var(--surface);
          border-left: 1px solid var(--rule-2); transform: translateX(100%); visibility: hidden;
          transition: transform .18s ease, visibility 0s .18s; display: flex; flex-direction: column; }
.drawer.open { transform: none; visibility: visible; transition: transform .18s ease; box-shadow: -24px 0 48px rgb(0 0 0 / .35); }
.drawer > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--rule); }
.drawer .body { overflow: auto; flex: 1; }
.drawer section { padding: 16px; border-bottom: 1px solid var(--rule); }
.drawer section:last-child { border-bottom: 0; }
.drawer h2 { margin-bottom: 12px; }
.step { position: relative; padding-left: 16px; }
.step::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: var(--rule-2); border-radius: 1px; }
.step.now::before { background: var(--accent); }

/* Dialogs */
dialog { color: var(--ink); background: var(--surface); border: 1px solid var(--rule-2); border-radius: var(--r); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(5 6 8 / .65); }
dialog .dhead { padding: 16px 16px 0; } dialog .dbody { padding: 12px 16px 16px; } dialog .dfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rule); }
#palette { width: min(560px, calc(100vw - 32px)); margin-top: 14vh; }
#palette input { width: 100%; height: 44px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 0 16px; font-size: 15px; background: transparent; }
#palette input:focus-visible { outline: none; }
#palette ul { list-style: none; margin: 0; padding: 4px; max-height: 320px; overflow: auto; }
#palette li { display: flex; justify-content: space-between; gap: 12px; align-items: center; height: 32px; padding: 0 12px; border-radius: var(--r); cursor: pointer; }
#palette li[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
#palette .none { padding: 16px; color: var(--muted); }

/* Charts */
.chart { position: relative; } .chart svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--canvas); border: 1px solid var(--rule-2); border-radius: var(--r);
       padding: 6px 8px; font-size: 12px; line-height: 16px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 2; }
.strip { display: grid; grid-template-columns: 148px minmax(0, 1fr) 112px 72px; gap: 8px 12px; align-items: center; }
.track { position: relative; height: 24px; border-bottom: 1px solid var(--rule); }
.track i { position: absolute; top: 6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--faint); border: 2px solid var(--surface); box-sizing: content-box; }
.track i.sel { background: var(--accent); }
.bandbar { position: relative; height: 28px; background: var(--canvas); border: 1px solid var(--rule); border-radius: var(--r); }
.bandbar b { position: absolute; top: 5px; bottom: 5px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 2px; }
.bandbar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }

footer.page { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; line-height: 16px; max-width: 90ch; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:nth-child(3) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--rule); }
                              .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--rule); gap: 4px; }
  .rail a { flex: 0 0 auto; gap: 8px; } .rail .note, .rail kbd { display: none; }
  main { padding: 16px 16px 48px; } .org, .find span.hint { display: none; } .find { min-width: 0; gap: 8px; }
  .strip { grid-template-columns: 112px minmax(0, 1fr) 84px; } .strip .delta { display: none; }
  dl.kv { grid-template-columns: 104px minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .find kbd { display: none; } .find span.hint { display: inline; font-size: 0; } .find span.hint::after { content: "Search"; font-size: 13px; }
  .kpis { grid-template-columns: minmax(0, 1fr); } .kpi + .kpi, .kpi:nth-child(3) { border-left: 0; border-top: 1px solid var(--rule); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <a class="brand" href="#/overview" aria-label="CarbonX, overview"><span class="mark" aria-hidden="true"></span>CarbonX</a>
  <span class="org" id="org"></span>
  <span class="spacer"></span>
  <button class="find" id="find" type="button" aria-haspopup="dialog" aria-label="Search and commands"><span class="hint">Search or jump to</span><kbd>Ctrl K</kbd></button>
  <button class="chip" id="chain-chip" type="button" aria-label="Audit chain status"><span class="dot" id="chain-dot"></span><span id="chain-text"></span></button>
</header>
<div class="shell">
  <nav class="rail" aria-label="Sections" id="rail"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" aria-hidden="true">
  <header><div><div class="small muted" id="drawer-kicker"></div><h2 id="drawer-title" tabindex="-1" style="font-size:16px;line-height:24px"></h2></div>
    <button class="btn quiet" id="drawer-close" type="button" aria-label="Close provenance">Close <kbd>Esc</kbd></button></header>
  <div class="body" id="drawer-body"></div>
</aside>

<dialog id="palette" aria-label="Command palette">
  <input id="palette-input" type="text" placeholder="Search sections, figures and actions" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
  <ul id="palette-list" role="listbox" aria-label="Results"></ul>
</dialog>

<dialog id="correct" aria-labelledby="correct-title">
  <form method="dialog" id="correct-form">
    <div class="dhead"><h2 id="correct-title" style="font-size:16px;line-height:24px">Correct an activity</h2>
      <p class="muted" style="margin:4px 0 0">On the workbench this closes the old row and writes a new one, with your reason in the audit trail. Here it is a preview: this file has no database, so nothing is stored.</p></div>
    <div class="dbody stack" id="correct-body"></div>
    <div class="dfoot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="correct-apply" value="apply">Show the effect</button></div>
  </form>
</dialog>

function bindOverview() {

function alterOneDigit(text) {

/* ---------- ledger ---------- */

  <section class="panel" style="margin-top:16px" aria-labelledby="ev-t"><header><h2 id="ev-t">What the sample shows</h2></header><div class="pad" aria-live="polite">
    ${ev ? `<dl class="kv"><dt>Projected</dt><dd class="mono">${esc(ev.projected.toFixed(6))} tCO2e</dd><dt>Upper limit</dt><dd>overstatement up to <strong class="mono">${(ev.upperOver).toFixed(3)}</strong> tCO2e, understatement up to <strong class="mono">${(ev.upperUnder).toFixed(3)}</strong>, at ${Math.round(s.conf * 100)}%</dd>
      <dt>Against tolerable</dt><dd>${ev.within ? '<span class="ok">both limits are within it</span>' : '<span class="bad">a limit exceeds it</span>'} (${esc(dp(String(Number(formatScaled(r.total, 6)) * Number(s.tol) / 100), 3))} tCO2e)</dd></dl>`
      : `<p class="muted" style="margin:0">Shown once every line above has a result. <button class="btn" type="button" id="agree-all">Record "agrees" for every line</button></p>`}
    <p class="muted small" style="margin:12px 0 0;max-width:80ch">This is arithmetic on what you enter here, which this file does not store. It reaches no conclusion about the report: that is the accredited verifier's judgement. Understatements are this method's weak side, and completeness (sources missing from the report altogether) needs a different test.</p></div></section>`;
}
function bindSampling() {
  const s = S.samp;
  const redraw = async (id) => {
    const keep = document.activeElement?.id === id; s.results = {}; await drawSample(); render();
    if (keep) { const el = $("#" + id); el?.focus(); if (el?.type === "text") el.setSelectionRange(el.value.length, el.value.length); }
  };
  $("#sreport").onchange = (e) => { s.report = +e.target.value; redraw("sreport"); };
  $("#sconf").onchange = (e) => { s.conf = e.target.value; redraw("sconf"); };
  $("#stol").onchange = (e) => { s.tol = e.target.value.trim(); redraw("stol"); };
  $("#snonce").onchange = (e) => { s.nonce = e.target.value; redraw("snonce"); };
  $("#sdraw").onclick = () => redraw("sdraw");
  $$("[data-agree]").forEach((b) => b.onclick = () => { $(`#a-${b.dataset.agree}`).value = b.dataset.book.replace(/0+$/, "").replace(/\.$/, ""); if (!$(`#f-${b.dataset.agree}`).value) $(`#f-${b.dataset.agree}`).value = "agrees with the source document"; });
  $$("[data-save]").forEach((b) => b.onclick = () => { const k = b.dataset.save, a = $(`#a-${k}`).value.trim(), f = $(`#f-${k}`).value.trim();
    if (!/^\d+(\.\d+)?$/.test(a) || !f) { alert("Enter the audited figure and what was checked."); return; } s.results[k] = {audited: a, note: f}; render(); });
  $$("[data-undo]").forEach((b) => b.onclick = () => { delete s.results[b.dataset.undo]; render(); });
  $("#agree-all")?.addEventListener("click", () => { const r = s.run; const all = [...r.sel.certain.map(([k]) => k), ...r.sel.sampled];
    for (const k of all) s.results[k] = {audited: formatScaled(r.items.find((i) => i.key === k).value, 6), note: "agrees with the source document"}; render(); });
}

/* ---------- audit trail ---------- */
function tamperText(payload, reason) {
  if (reason && payload.includes(reason)) return payload.replace(reason, "routine re-read");
  return payload.replace(/(\d)Z$/, (m, d) => ((+d + 1) % 10) + "Z");
}
async function verifyChain() {
  const ev = S.audit.events, res = []; let first = null;
  for (let i = 0; i < ev.length; i++) {
    const computed = await sha256Hex(ev[i].payload), hashOk = computed === ev[i].hash, linkOk = i === 0 ? null : ev[i].prev === ev[i - 1].hash;
    res.push({hashOk, linkOk}); if (!first && (!hashOk || linkOk === false)) first = {id: ev[i].id, why: !hashOk ? "event_hash does not match its contents" : "prev_hash does not match the event before it"};
  }
  S.audit.result = {res, first};
}
function renderAudit() {
  const A = S.audit, r = A.result, a = DATA.audit.anchors, last = A.events[A.events.length - 1];
  const pick = A.events.find((e) => e.id === A.pick);
  return `<div class="head"><div><h1>Audit trail</h1><p class="lede">Every change to an audited table is an event, written by the database itself, and each event's hash includes the hash of the one before it. Below is the part of the chain from the meter correction to the four new reports.</p></div>
    <button class="btn primary" id="vchain" type="button" ${hasSubtle ? "" : "disabled"}>Verify the chain</button></div>
  <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><div class="k">Events in the database</div><div class="v">${DATA.audit.total_events.toLocaleString("en-GB")}</div><div class="d">${esc(DATA.audit.chain_intact ? "chain consistent when this file was built" : "chain broken when this file was built")}</div></div>
    <div class="kpi"><div class="k">Shown here</div><div class="v">${A.events.length}</div><div class="d">events ${A.events[0].id} to ${last.id}</div></div>
    <div class="kpi"><div class="k">Anchors outside the database</div><div class="v">${a.count}</div><div class="d">${a.count ? (a.problems.length ? `<span class="bad">${a.problems.length} mismatch</span>` : "all match") : "none recorded yet"}</div></div></div>
  <section class="panel" style="margin-top:16px" aria-label="Audit events"><div class="scroll"><table><thead><tr><th class="n">Event</th><th>Row</th><th>Action</th><th>Actor and reason</th><th>When</th><th>prev_hash</th><th>event_hash</th><th>Check</th></tr></thead><tbody>
    ${A.events.map((e, i) => { const c = r?.res[i], bad = c && (!c.hashOk || c.linkOk === false);
      return `<tr ${bad ? 'style="background:var(--bad-soft)"' : ""}><td class="n">${e.id}</td><td class="small">${esc(e.table)} ${e.row}</td><td class="small">${esc(e.action)}</td><td class="small wrap" style="min-width:200px">${esc(e.actor || "-")}${e.reason ? `<div class="muted">${esc(e.reason)}</div>` : ""}</td>
      <td class="small">${esc(when(e.at))}</td><td class="mono small ${c && c.linkOk === false ? "bad" : ""}">${i === 0 ? '<span class="muted">window start</span>' : hshort(e.prev, 10)}</td><td class="mono small ${c && !c.hashOk ? "bad" : ""}">${hshort(e.hash, 10)}</td>
      <td class="small">${!c ? '<span class="muted">not checked</span>' : bad ? `<span class="bad">${!c.hashOk ? "contents changed" : "link broken"}</span>` : '<span class="ok">ok</span>'}</td></tr>`; }).join("")}</tbody></table></div></section>
  ${r ? `<div class="notice ${r.first ? "warn" : "good"}" style="margin-top:16px" aria-live="polite">${r.first ? `<strong>The chain breaks at event ${r.first.id}:</strong> ${esc(r.first.why)}.` : `<strong>The chain is intact.</strong> Each of the ${A.events.length} events hashes to its stored hash, and each links to the one before.`}</div>` : ""}
  <section class="panel" style="margin-top:16px" aria-labelledby="tp-t"><header><h2 id="tp-t">Try to rewrite history</h2>${A.tampered ? '<span class="tag bad">history rewritten in this page</span>' : ""}</header>
    <div class="pad stack"><p class="muted" style="margin:0;max-width:80ch">Edit one event in this page's copy of the chain, then verify. Editing the contents breaks that event's own hash. A database owner could also recompute the hash, which moves the break to the next event. They would have to rewrite every later event too, and then nothing inside the chain would show it: only a hash kept outside the database can.</p>
      <div class="row"><div class="field" style="min-width:260px;flex:1"><label for="tpick">Event to edit</label><select id="tpick">${A.events.map((e) => `<option value="${e.id}" ${e.id === A.pick ? "selected" : ""}>${e.id}: ${esc(e.table)} ${esc(e.action)}${e.reason ? ", with a reason" : ""}</option>`).join("")}</select></div>
        <div><label id="tm">What the attacker does</label><div class="seg" role="group" aria-labelledby="tm"><button type="button" aria-pressed="${A.mode === "contents"}" data-mode="contents">Edit contents</button><button type="button" aria-pressed="${A.mode === "recompute"}" data-mode="recompute">Edit and recompute its hash</button></div></div>
        <button class="btn" id="tdo" type="button" ${hasSubtle ? "" : "disabled"}>Rewrite it</button><button class="btn quiet" id="treset" type="button" ${A.tampered ? "" : "disabled"}>Restore</button></div>
      ${A.tampered && A.mode === "recompute" && pick && pick.id === last.id ? `<div class="notice warn"><strong>This is the newest event.</strong> No later event records its hash, so recomputing it leaves a chain that verifies. Only an anchor kept outside the database would catch this.</div>` : ""}
      <p class="small muted" style="margin:0">Anchors: ${a.count ? `${a.count} on file.` : "none recorded."} <code>python -m carbonx.evidence.anchor record</code> copies the chain's latest hash to a file; kept somewhere the database owner cannot reach, it makes this attack visible.</p></div></section>`;
}
function bindAudit() {
  const A = S.audit;
  $("#vchain").onclick = async () => { await verifyChain(); render(); $("#vchain")?.focus(); };
  $("#tpick").onchange = (e) => { A.pick = +e.target.value; };
  $$("[data-mode]").forEach((b) => b.onclick = () => { A.mode = b.dataset.mode; render(); $(`[data-mode="${A.mode}"]`).focus(); });
  $("#tdo").onclick = async () => {
    A.events = JSON.parse(JSON.stringify(DATA.audit.window));
    const i = A.events.findIndex((e) => e.id === A.pick), ev = A.events[i], orig = DATA.audit.window[i];
    ev.payload = tamperText(orig.payload, orig.reason); if (A.mode === "recompute") ev.hash = await sha256Hex(ev.payload);
    A.tampered = true; await verifyChain(); render(); $("#tdo")?.focus();
  };
  $("#treset").onclick = () => { A.events = JSON.parse(JSON.stringify(DATA.audit.window)); A.tampered = false; A.result = null; render(); };
}

/* ---------- command palette ---------- */
const palette = $("#palette"), pInput = $("#palette-input"), pList = $("#palette-list");
let pItems = [], pSel = 0;
const COMMANDS = () => [
  ...VIEWS.map(([id, label], i) => ({label: `Go to ${label}`, hint: String(i + 1), run: () => go(id)})),
  {label: "Ledger: Scope 1 only", run: () => { S.ledger.scope = "1"; go("ledger"); }},
  {label: "Ledger: lines with no document", run: () => { S.ledger.evidence = "no"; go("ledger"); }},
  {label: "Reports: verify all stored reports", run: async () => { for (const r of DATA.reports) await verifyOne(r.id); go("reports"); }},
  {label: "Sampling: draw at the stored settings", run: async () => { await drawSample(); go("sampling"); }},
  {label: "Audit trail: verify the chain", run: async () => { await verifyChain(); go("audit"); }},
  {label: "Registry: the series CarbonX calculates with", run: () => { S.reg.key = DATA.registry.series.find((x) => x.used).key; S.reg.year = null; go("registry"); }},
  ...DATA.ledger.map((r) => ({label: `Open ${typeName(r.type)}, ${monthOf(r.period_start)}`, hint: dp(r.tco2e, 1) + " t", run: () => { go("ledger"); openDrawer(r.calc_id); }})),
];
function pFilter() {
  const q = pInput.value.trim().toLowerCase();
  pItems = COMMANDS().filter((c) => !q || q.split(/\s+/).every((w) => c.label.toLowerCase().includes(w))).slice(0, 40); pSel = 0; pPaint();
}
function pPaint() {
  pList.innerHTML = pItems.length ? pItems.map((c, i) => `<li role="option" id="po-${i}" aria-selected="${i === pSel}" data-i="${i}"><span>${esc(c.label)}</span>${c.hint ? `<kbd>${esc(c.hint)}</kbd>` : ""}</li>`).join("") : `<li class="none">Nothing matches that.</li>`;
  pInput.setAttribute("aria-activedescendant", pItems.length ? `po-${pSel}` : ""); $(`#po-${pSel}`)?.scrollIntoView({block: "nearest"});
}
function openPalette() { pInput.value = ""; pFilter(); palette.showModal(); pInput.focus(); }
pInput.oninput = pFilter;
pInput.onkeydown = (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); pSel = Math.min(pSel + 1, pItems.length - 1); pPaint(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); pSel = Math.max(pSel - 1, 0); pPaint(); }
  else if (e.key === "Enter" && pItems[pSel]) { e.preventDefault(); const c = pItems[pSel]; palette.close(); c.run(); }
};
pList.onclick = (e) => { const li = e.target.closest("li[data-i]"); if (li) { const c = pItems[+li.dataset.i]; palette.close(); c.run(); } };
palette.addEventListener("click", (e) => { if (e.target === palette) palette.close(); });

document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette.open ? palette.close() : openPalette(); return; }
  if (e.key === "Escape" && $("#drawer").classList.contains("open") && !document.querySelector("dialog[open]")) { closeDrawer(); return; }
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-6]$/.test(e.key) && !document.querySelector("dialog[open]")) go(VIEWS[+e.key - 1][0]);
});

drawSample().then(() => { route(false); });
</script>
</body>
