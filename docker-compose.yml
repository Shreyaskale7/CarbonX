services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carbonx
      POSTGRES_USER: carbonx
      POSTGRES_PASSWORD: carbonx
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  pgdata:
