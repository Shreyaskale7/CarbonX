name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: carbonx
          POSTGRES_USER: carbonx
          POSTGRES_PASSWORD: carbonx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbonx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carbonx:carbonx@localhost:5432/carbonx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: python scripts/seed_policies.py
      - run: pytest -q
