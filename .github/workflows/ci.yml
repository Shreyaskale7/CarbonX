name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: carbonx
          POSTGRES_USER: carbonx
          POSTGRES_PASSWORD: carbonx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbonx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The app and tests run as the non-owner role created by migration 0005;
      # only Alembic uses the owner.
      DATABASE_URL: postgresql://carbonx_app:carbonx_app@localhost:5432/carbonx
      MIGRATION_DATABASE_URL: postgresql+psycopg://carbonx:carbonx@localhost:5432/carbonx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: python scripts/seed_policies.py
      - run: python scripts/load_cea.py --db   # the committed open registry
      - run: python scripts/load_bee_factors.py --db   # BEE Annexure IV fuel factors
      # reproduce.sh steps 4-6. Before pytest: its concurrency tests commit
      # their own organisations, and the sample must be org 1.
      - name: sample reports regenerate byte-identically
        run: |
          python scripts/seed_sample.py
          python -m carbonx.engine.calculate --org 1 --policy VINTAGE_MATCHED
          python -m carbonx.engine.report --org 1 --fy FY2025-26 --verify
          python -m carbonx.uncertainty.propagate --report 2
      - run: pytest -q
      # Every generated document and figure must equal what its script produces
      # from the committed data: nobody edits a result by hand.
      - name: generated results are up to date
        run: |
          python scripts/rq1_materiality.py && python scripts/rq2_deltas.py
          python scripts/rq3_compliance.py && python scripts/nowcast.py
          python scripts/ember_crosscheck.py && python scripts/registry_changelog.py
          python scripts/compare_bee_ipcc.py
          git diff --exit-code docs/ data/cea/CHANGELOG.md
      - name: the console is its template plus its embedded data
        run: python scripts/build_console.py --check
      - name: the registry passes its release checks
        run: python scripts/build_registry_release.py --draft
      - name: one-command pipeline finishes with the reproducibility demonstration
        run: python scripts/demo_reproducibility.py --org 1
      # Runs, but is not diffed: it comes from a numerical optimiser, so the
      # last printed digit may differ across platforms and library versions.
      - name: extraction evaluation runs
        run: python scripts/eval_extraction.py
